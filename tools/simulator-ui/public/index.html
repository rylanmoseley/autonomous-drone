<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulator UI</title>
    <style>
        body { margin: 0; background: #1a1a1a; color: white; font-family: sans-serif; overflow: hidden; display: flex; }
        #canvas-container { flex: 1; position: relative; height: 100vh; }
        #sidebar { width: 350px; background: #222; padding: 20px; overflow-y: auto; height: 100vh; box-sizing: border-box; }
        .panel { margin-bottom: 20px; padding: 10px; background: #333; border-radius: 8px; }
        .row { display: flex; align-items: center; margin-bottom: 8px; }
        .row label { width: 30px; }
        .row input { flex: 1; margin: 0 10px; }
        .row span { width: 40px; font-size: 12px; }
        button { width: 100%; padding: 10px; margin-top: 10px; cursor: pointer; }
    </style>
    <!-- Import Map for Three.js -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.168.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.168.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="sidebar">
        <h2>Simulation UI</h2>
        
        <div class="panel">
            <h3>Telemetry Readout</h3>
            <div id="telemetry-data" style="font-size: 14px; font-family: monospace;">Waiting for telemetry...</div>
        </div>

        <div class="panel">
            <h3>Command Setpoint (6D)</h3>
            <div id="command-sliders">
                <!-- Sliders injected via JS -->
            </div>
            <button id="btn-zero">Zero Setpoints</button>
        </div>

        <div class="panel">
            <h3>Hardware Config</h3>
            <div id="config-form">
                <div class="row">
                    <label style="width: 120px;">Mass (kg)</label>
                    <input type="number" id="cfg-mass" value="1.2" step="0.1">
                </div>
                <div class="row">
                    <label style="width: 120px;">Linear Drag</label>
                    <input type="number" id="cfg-drag" value="0.5" step="0.1">
                </div>
                <div class="row">
                    <label style="width: 120px;">Battery Volts</label>
                    <input type="number" id="cfg-volts" value="14.8" step="0.1">
                </div>
                
                <h4 style="margin-top: 15px; margin-bottom: 5px;">Rotors</h4>
                <div id="rotor-list"></div>
                <button id="btn-add-rotor" style="background: #444; margin-bottom: 15px;">+ Add Rotor</button>

                <button id="btn-config" style="background: #2080ff; color: white; border: none; font-weight: bold;">Update Config</button>
            </div>
        </div>
    </div>

    <!-- Socket.IO via CDN -->
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // 1. Setup Three.js Scene
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a1a);
        
        const camera = new THREE.PerspectiveCamera(75, container.clientWidth / container.clientHeight, 0.1, 1000);
        camera.position.set(2, 2, 2);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        container.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        
        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);
        const pointLight = new THREE.PointLight(0xffffff, 1);
        pointLight.position.set(10, 10, 10);
        scene.add(pointLight);

        // Grid
        const gridHelper = new THREE.GridHelper(20, 20, 0x888888, 0x444444);
        scene.add(gridHelper);

        // Drone Group
        const droneGroup = new THREE.Group();
        scene.add(droneGroup);

        // Body Mesh
        const bodyGeo = new THREE.BoxGeometry(0.2, 0.1, 0.2); // Swap Y and Z for visual (Three uses Y-up)
        const bodyMat = new THREE.MeshStandardMaterial({ color: 0xffa500 });
        const bodyMesh = new THREE.Mesh(bodyGeo, bodyMat);
        droneGroup.add(bodyMesh);

        let rotorMeshes = [];

        // Resize handler
        window.addEventListener('resize', () => {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        });

        // Render loop
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            
            // Spin propellers
            rotorMeshes.forEach(group => {
                group.children.forEach(child => {
                    if (child.userData.isProp) {
                        child.rotation.y += child.userData.spinSpeed;
                    }
                });
            });

            renderer.render(scene, camera);
        }
        animate();

        // 2. Setup UI Logic & Socket.IO
        // Force websocket transport to avoid HTTP polling 404s on strict reverse proxies
        const socket = io({ transports: ['websocket'] }); 
        
        const cmdState = { lx: 0, ly: 0, lz: 0, ax: 0, ay: 0, az: 0 };
        const telemetryDiv = document.getElementById('telemetry-data');

        function updateDroneVisuals(tel) {
            // Convert NED (North-East-Down) to Three.js (X-Right, Y-Up, Z-Forward)
            droneGroup.position.set(tel.position[0], -tel.position[2], tel.position[1]);
            // Extremely simplified rotation mapping for visualization
            droneGroup.rotation.set(tel.euler_angles[0], -tel.euler_angles[2], tel.euler_angles[1]);

            // Rebuild rotors if config changed or first load
            if (tel.rotors && rotorMeshes.length !== tel.rotors.length) {
                rotorMeshes.forEach(m => droneGroup.remove(m));
                rotorMeshes = [];
                
                const propGeo = new THREE.CylinderGeometry(0.12, 0.12, 0.005, 16);
                const propMat = new THREE.MeshStandardMaterial({ color: 0x88ccff, transparent: true, opacity: 0.6 });
                
                const motorGeo = new THREE.CylinderGeometry(0.03, 0.03, 0.04, 16);
                const motorMat = new THREE.MeshStandardMaterial({ color: 0x222222 });

                const armMat = new THREE.MeshStandardMaterial({ color: 0x555555 });
                
                tel.rotors.forEach(r => {
                    const group = new THREE.Group();
                    
                    // Map NED offsets to ThreeJS coordinates
                    const px = r.position[0];
                    const py = -r.position[2];
                    const pz = r.position[1];
                    group.position.set(px, py, pz);
                    
                    // Motor
                    const motor = new THREE.Mesh(motorGeo, motorMat);
                    motor.position.y = -0.01;
                    group.add(motor);
                    
                    // Propeller
                    const prop = new THREE.Mesh(propGeo, propMat);
                    prop.position.y = 0.02;
                    // Tag the prop so we can spin it in animate loop
                    prop.userData.isProp = true;
                    // Fake spin speed/direction based on typical CW/CCW
                    prop.userData.spinSpeed = (Math.random() * 0.2 + 0.3) * (r.position[0] * r.position[1] > 0 ? 1 : -1); 
                    group.add(prop);

                    // Arm (Line from center to motor)
                    const distance = Math.sqrt(px*px + py*py + pz*pz);
                    const armGeo = new THREE.BoxGeometry(0.02, 0.02, distance);
                    const arm = new THREE.Mesh(armGeo, armMat);
                    
                    // Position arm halfway between center and motor
                    arm.position.set(-px/2, -py/2, -pz/2);
                    arm.lookAt(0, 0, 0); // Point back to center
                    group.add(arm);

                    droneGroup.add(group);
                    rotorMeshes.push(group);
                });
            }
        }

        async function fetchTelemetry() {
            try {
                const res = await fetch('telemetry');
                if (!res.ok) return;
                const data = await res.json();
                if (Object.keys(data).length === 0) return;

                updateDroneVisuals(data);
                
                telemetryDiv.innerHTML = `
                    <div><b>Pos:</b> ${data.position.map(v => v.toFixed(2)).join(', ')}</div>
                    <div><b>Vel:</b> ${data.velocity.map(v => v.toFixed(2)).join(', ')}</div>
                    <div><b>Ang:</b> ${data.euler_angles.map(v => v.toFixed(2)).join(', ')}</div>
                    <hr/>
                    <div><b>Voltage:</b> ${data.battery_voltage.toFixed(2)}V</div>
                    <div><b>Current:</b> ${data.current_draw.toFixed(2)}A</div>
                    <div><b>Consumed:</b> ${data.consumed_capacity.toFixed(2)}mAh</div>
                `;
            } catch (e) {
                // Log once every couple seconds to avoid spamming the console 30 times a second
                if (Math.random() < 0.02) {
                    console.error("Telemetry fetch/parse error:", e);
                }
            }
        }
        setInterval(fetchTelemetry, 33);

        const sendCommand = () => {
            fetch('command', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(cmdState)
            }).catch(e => {});
        };

        // Build Sliders
        const sliderContainer = document.getElementById('command-sliders');
        ['lx', 'ly', 'lz', 'ax', 'ay', 'az'].forEach(key => {
            const row = document.createElement('div');
            row.className = 'row';
            
            const lbl = document.createElement('label');
            lbl.textContent = key;
            
            const input = document.createElement('input');
            input.type = 'range';
            input.min = -1;
            input.max = 1;
            input.step = 0.01;
            input.value = 0;
            
            const valSpan = document.createElement('span');
            valSpan.textContent = '0.00';
            
            input.addEventListener('input', (e) => {
                const val = parseFloat(e.target.value);
                valSpan.textContent = val.toFixed(2);
                cmdState[key] = val;
                sendCommand();
            });
            
            row.appendChild(lbl);
            row.appendChild(input);
            row.appendChild(valSpan);
            sliderContainer.appendChild(row);
        });

        document.getElementById('btn-zero').addEventListener('click', () => {
            Object.keys(cmdState).forEach(k => cmdState[k] = 0);
            sliderContainer.querySelectorAll('input[type="range"]').forEach(inp => { inp.value = 0; });
            sliderContainer.querySelectorAll('span').forEach(sp => { sp.textContent = '0.00'; });
            sendCommand();
        });

        // --- Rotor Configuration GUI Logic ---
        let uiRotors = [
            { x: 0.1, y: 0.1, z: 0, kf: 0.05, km: 0.001, cw: false },
            { x: -0.1, y: -0.1, z: 0, kf: 0.05, km: 0.001, cw: false },
            { x: 0.1, y: -0.1, z: 0, kf: 0.05, km: 0.001, cw: true },
            { x: -0.1, y: 0.1, z: 0, kf: 0.05, km: 0.001, cw: true }
        ];

        const rotorListEl = document.getElementById('rotor-list');
        
        function renderRotors() {
            rotorListEl.innerHTML = '';
            uiRotors.forEach((r, idx) => {
                const div = document.createElement('div');
                div.style.background = '#2a2a2a';
                div.style.padding = '8px';
                div.style.marginBottom = '8px';
                div.style.borderRadius = '4px';
                
                div.innerHTML = `
                    <div style="display: flex; justify-content: space-between; margin-bottom: 4px;">
                        <b>Rotor ${idx + 1}</b>
                        <button onclick="removeRotor(${idx})" style="width: auto; padding: 2px 6px; margin: 0; background: #822;">X</button>
                    </div>
                    <div style="display: flex; gap: 4px; margin-bottom: 4px;">
                        X:<input type="number" step="0.01" value="${r.x}" onchange="updateRotor(${idx}, 'x', this.value)" style="width: 40px">
                        Y:<input type="number" step="0.01" value="${r.y}" onchange="updateRotor(${idx}, 'y', this.value)" style="width: 40px">
                        Z:<input type="number" step="0.01" value="${r.z}" onchange="updateRotor(${idx}, 'z', this.value)" style="width: 40px">
                    </div>
                    <div style="display: flex; gap: 4px; font-size: 11px;">
                        Kf:<input type="number" step="0.01" value="${r.kf}" onchange="updateRotor(${idx}, 'kf', this.value)" style="width: 40px">
                        Km:<input type="number" step="0.001" value="${r.km}" onchange="updateRotor(${idx}, 'km', this.value)" style="width: 40px">
                        <label><input type="checkbox" ${r.cw ? 'checked' : ''} onchange="updateRotor(${idx}, 'cw', this.checked)"> CW</label>
                    </div>
                `;
                rotorListEl.appendChild(div);
            });
        }

        window.removeRotor = (idx) => {
            uiRotors.splice(idx, 1);
            renderRotors();
        };

        window.updateRotor = (idx, field, val) => {
            uiRotors[idx][field] = field === 'cw' ? val : parseFloat(val);
        };

        document.getElementById('btn-add-rotor').addEventListener('click', () => {
            uiRotors.push({ x: 0, y: 0, z: 0, kf: 0.05, km: 0.001, cw: true });
            renderRotors();
        });

        // Initial render
        renderRotors();

        document.getElementById('btn-config').addEventListener('click', () => {
            const mass = parseFloat(document.getElementById('cfg-mass').value);
            const drag = parseFloat(document.getElementById('cfg-drag').value);
            const volts = parseFloat(document.getElementById('cfg-volts').value);
            
            const formattedRotors = uiRotors.map(r => ({
                position: [r.x, r.y, r.z],
                thrust_coefficient: r.kf,
                torque_coefficient: r.km,
                spins_clockwise: r.cw
            }));

            fetch('config', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    mass: mass,
                    linear_drag_coefficient: drag,
                    nominal_voltage: volts,
                    rotors: formattedRotors
                })
            }).catch(e => {});
        });
    </script>
</body>
</html>
