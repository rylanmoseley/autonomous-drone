# /etc/mavlink-router/main.conf
# MAVLink Router configuration for Autonomous Drone Companion SBC

[General]
ReportStats = false
Mavlink-router-port = 14550

[UartEndpoint flightcontroller]
Device = /dev/flightcontroller
Baud = 921600

[UdpEndpoint autopilot]
Mode = Normal
Address = 127.0.0.1
Port = 14550

[UdpEndpoint gcs_broadcast]
Mode = Normal
Address = 192.168.4.255
Port = 14550

[UdpEndpoint gcs_listen]
Mode = Server
Address = 0.0.0.0
Port = 14555
