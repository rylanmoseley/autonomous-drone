# /etc/sysctl.d/99-drone-tuning.conf
# Realtime scheduling and low-latency network tuning for autonomous flight

# Realtime Scheduling: 95% CPU allocation for SCHED_FIFO/SCHED_RR threads
kernel.sched_rt_runtime_us = 950000

# Memory Management: Minimize swapping to SD card / eMMC
vm.swappiness = 10
vm.vfs_cache_pressure = 50

# Network UDP Socket Buffers: High-rate MAVLink telemetry & video streaming
net.core.rmem_max = 4194304
net.core.wmem_max = 4194304
net.core.rmem_default = 1048576
net.core.wmem_default = 1048576

# IPv4 Routing: Forwarding between WiFi AP and USB-C Ethernet gadget
net.ipv4.ip_forward = 1

# System limits
fs.file-max = 2097152
