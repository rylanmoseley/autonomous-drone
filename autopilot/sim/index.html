<!DOCTYPE html>
<html>
<head>
    <title>Autonomous Drone Autopilot Simulator</title>
    <style>
        body { margin: 0; display: flex; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #1a1a1a; color: #333; }
        #canvas-container { flex: 1; height: 100vh; position: relative; }
        #sidebar { width: 380px; padding: 15px; background: #f4f6f9; height: 100vh; overflow-y: auto; box-sizing: border-box; }
        .panel { margin-bottom: 15px; background: white; padding: 14px; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); }
        .panel h3 { margin-top: 0; margin-bottom: 10px; font-size: 15px; border-bottom: 1px solid #eee; padding-bottom: 5px; color: #2c3e50; }
        button { width: 100%; padding: 8px; margin-top: 8px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background: #0056b3; }
        .slider-group { margin-bottom: 8px; }
        .slider-group label { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 2px; }
        .slider-group input[type="range"] { width: 100%; }
        .metrics-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 5px; }
        .metric-card { background: #f8f9fa; border: 1px solid #e9ecef; border-radius: 6px; padding: 8px; text-align: center; }
        .metric-val { font-size: 16px; font-weight: bold; color: #007bff; margin-top: 2px; }
        .metric-lbl { font-size: 11px; color: #6c757d; }
        .shape-row { margin-bottom: 8px; padding-bottom: 8px; border-bottom: 1px solid #eee; }
        .shape-inputs { display: flex; gap: 4px; margin-top: 4px; }
        .shape-inputs input { width: 45px; }
        select { width: 100%; padding: 5px; margin-bottom: 5px; }
        #pip-container { position: absolute; bottom: 20px; right: 20px; width: 320px; height: 240px; border: 2px solid #555; z-index: 10; background: black; border-radius: 6px; overflow: hidden; }
        #pip-overlay { position: absolute; top: 0; left: 0; pointer-events: none; }
        .legend { display: flex; gap: 10px; font-size: 11px; margin-top: 8px; }
        .legend span { display: inline-flex; align-items: center; gap: 4px; }
        .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
    </style>
</head>
<body>
    <div id="sidebar">
        <h2 style="margin-top: 0; color: #1e3c72; font-size: 20px;">Autopilot Simulator</h2>
        
        <!-- Live Tracking Error Metrics -->
        <div class="panel">
            <h3>Closed-Loop Tracking Metrics</h3>
            <div class="metrics-grid">
                <div class="metric-card">
                    <div class="metric-lbl">Current Error</div>
                    <div class="metric-val" id="metric-curr-err">0.000 m</div>
                </div>
                <div class="metric-card">
                    <div class="metric-lbl">Tracking RMSE</div>
                    <div class="metric-val" id="metric-rmse" style="color: #28a745;">0.000 m</div>
                </div>
                <div class="metric-card">
                    <div class="metric-lbl">Peak Error</div>
                    <div class="metric-val" id="metric-max-err" style="color: #dc3545;">0.000 m</div>
                </div>
                <div class="metric-card">
                    <div class="metric-lbl">Distance Traveled</div>
                    <div class="metric-val" id="metric-dist">0.0 m</div>
                </div>
            </div>
            <div class="legend">
                <span><span class="dot" style="background: #28a745;"></span> True Pose</span>
                <span><span class="dot" style="background: #00e5ff;"></span> Noisy Feedback</span>
                <span><span class="dot" style="background: #ff9900;"></span> Setpoint Target</span>
            </div>
        </div>

        <!-- Follower Kinematics & Imputed Noise Controls -->
        <div class="panel">
            <h3>Follower & Imputed Noise</h3>
            <label style="display: block; margin-bottom: 8px; font-size: 13px; font-weight: bold;">
                <input type="checkbox" id="noise-toggle" checked onchange="sendFollowerConfig()">
                Enable Imputed Noise
            </label>
            <div class="slider-group">
                <label><span>Position Noise &sigma;<sub>xy</sub>:</span><span id="lbl-pos-noise">0.03 m</span></label>
                <input type="range" id="pos-noise" min="0.0" max="0.15" step="0.005" value="0.03" oninput="sendFollowerConfig()">
            </div>
            <div class="slider-group">
                <label><span>Yaw Noise &sigma;<sub>&psi;</sub>:</span><span id="lbl-yaw-noise">0.02 rad</span></label>
                <input type="range" id="yaw-noise" min="0.0" max="0.15" step="0.005" value="0.02" oninput="sendFollowerConfig()">
            </div>
            <div class="slider-group">
                <label><span>Follower Lag &tau;:</span><span id="lbl-tau">0.15 s</span></label>
                <input type="range" id="follower-tau" min="0.05" max="0.50" step="0.01" value="0.15" oninput="sendFollowerConfig()">
            </div>
            <div class="slider-group">
                <label><span>Wind Drift X:</span><span id="lbl-drift-x">0.00 m/s</span></label>
                <input type="range" id="drift-x" min="-0.50" max="0.50" step="0.02" value="0.00" oninput="sendFollowerConfig()">
            </div>
            <div class="slider-group">
                <label><span>Wind Drift Y:</span><span id="lbl-drift-y">0.00 m/s</span></label>
                <input type="range" id="drift-y" min="-0.50" max="0.50" step="0.02" value="0.00" oninput="sendFollowerConfig()">
            </div>
            <button onclick="resetSim()" style="background: #6c757d;">Reset Drone & Metrics</button>
        </div>

        <!-- Vision Sensor Configuration -->
        <div class="panel">
            <h3>Vision Sensor</h3>
            <label style="font-size: 13px;">
                <input type="checkbox" id="vision-toggle" checked onchange="toggleVision()">
                Enable Vision Broadcast (Port 14553)
            </label>
        </div>

        <!-- Shape Map Setup -->
        <div class="panel">
            <h3>Gate / Obstacle Map</h3>
            <div id="shapes-list"></div>
            <button onclick="updateVisionGoals()" style="background: #28a745;">Update Gate World</button>
        </div>

        <!-- Mission Sequence -->
        <div class="panel">
            <h3>Autonomous Mission</h3>
            <label style="font-size: 12px;">Waypoint 1:</label>
            <select id="seq-1">
                <option value="circle" selected>Circle</option>
                <option value="triangle">Triangle</option>
                <option value="square">Square</option>
            </select>
            <label style="font-size: 12px;">Waypoint 2:</label>
            <select id="seq-2">
                <option value="circle">Circle</option>
                <option value="triangle" selected>Triangle</option>
                <option value="square">Square</option>
            </select>
            <label style="font-size: 12px;">Waypoint 3:</label>
            <select id="seq-3">
                <option value="circle">Circle</option>
                <option value="triangle">Triangle</option>
                <option value="square" selected>Square</option>
            </select>
            <button onclick="sendUISequence()">Start Mission (Port 14552)</button>
        </div>
    </div>
    
    <div id="canvas-container"></div>
    <div id="pip-container">
        <div id="pip-three"></div>
        <canvas id="pip-overlay" width="320" height="240"></canvas>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script>
        let shapes = {
            triangle: { id: 2, shape: 2, x: 2.5, y: 0.0, z: 1.2, yaw: 0.0, color: 0xff0000, segments: 3 },
            square:   { id: 3, shape: 3, x: 4.0, y: 0.4, z: 1.0, yaw: 0.0, color: 0x00ff00, segments: 4 },
            circle:   { id: 1, shape: 1, x: 1.2, y: -0.4, z: 1.0, yaw: 0.0, color: 0x0000ff, segments: 32 }
        };

        const shapesList = document.getElementById("shapes-list");
        Object.entries(shapes).forEach(([name, s]) => {
            const div = document.createElement("div");
            div.className = "shape-row";
            div.innerHTML = `
                <strong style="text-transform: capitalize; font-size: 13px;">${name} (Shape ${s.shape})</strong>
                <div class="shape-inputs">
                    X:<input type="number" step="0.1" value="${s.x}" id="${name}-x">
                    Y:<input type="number" step="0.1" value="${s.y}" id="${name}-y">
                    Z:<input type="number" step="0.1" value="${s.z}" id="${name}-z">
                    Yaw:<input type="number" step="0.1" value="${s.yaw}" id="${name}-yaw">
                </div>
            `;
            shapesList.appendChild(div);
        });

        const ws = new WebSocket("ws://" + location.host);
        
        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);
            if (data.drone) {
                drone.position.set(data.drone.x, data.drone.z, -data.drone.y);
                drone.rotation.y = data.drone.yaw + Math.PI / 2;
                drone.rotation.x = data.drone.pitch || 0;
                drone.rotation.z = data.drone.roll || 0;
            }
            if (data.feedback && feedbackMarker) {
                feedbackMarker.position.set(data.feedback.x, data.feedback.z, -data.feedback.y);
            }
            if (data.command && targetMarker) {
                targetMarker.position.set(data.command.x, data.command.z, -data.command.y);
            }
            if (data.metrics) {
                document.getElementById("metric-curr-err").innerText = data.metrics.current_error.toFixed(3) + " m";
                document.getElementById("metric-rmse").innerText = data.metrics.rmse.toFixed(3) + " m";
                document.getElementById("metric-max-err").innerText = data.metrics.max_error.toFixed(3) + " m";
                document.getElementById("metric-dist").innerText = data.metrics.distance.toFixed(1) + " m";
            }
        };

        function sendFollowerConfig() {
            const enabled = document.getElementById("noise-toggle").checked;
            const posNoise = parseFloat(document.getElementById("pos-noise").value);
            const yawNoise = parseFloat(document.getElementById("yaw-noise").value);
            const tau = parseFloat(document.getElementById("follower-tau").value);
            const driftX = parseFloat(document.getElementById("drift-x").value);
            const driftY = parseFloat(document.getElementById("drift-y").value);

            document.getElementById("lbl-pos-noise").innerText = posNoise.toFixed(3) + " m";
            document.getElementById("lbl-yaw-noise").innerText = yawNoise.toFixed(3) + " rad";
            document.getElementById("lbl-tau").innerText = tau.toFixed(2) + " s";
            document.getElementById("lbl-drift-x").innerText = driftX.toFixed(2) + " m/s";
            document.getElementById("lbl-drift-y").innerText = driftY.toFixed(2) + " m/s";

            if (ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({
                    type: "follower_config",
                    noise_enabled: enabled,
                    pos_noise_std: posNoise,
                    yaw_noise_std: yawNoise,
                    tau: tau,
                    drift_x: driftX,
                    drift_y: driftY
                }));
            }
        }

        function resetSim() {
            if (ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: "reset_sim" }));
            }
        }

        function toggleVision() {
            const enabled = document.getElementById("vision-toggle").checked;
            if (ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: "toggle", enabled: enabled }));
        }

        function updateVisionGoals() {
            Object.keys(shapes).forEach(name => {
                shapes[name].x = parseFloat(document.getElementById(`${name}-x`).value);
                shapes[name].y = parseFloat(document.getElementById(`${name}-y`).value);
                shapes[name].z = parseFloat(document.getElementById(`${name}-z`).value);
                shapes[name].yaw = parseFloat(document.getElementById(`${name}-yaw`).value);
            });
            const goalsArray = Object.values(shapes).map(s => ({
                id: s.id, shape: s.shape, x: s.x, y: s.y, z: s.z, yaw: s.yaw
            }));
            if (ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: "update_goals", goals: goalsArray }));
            updateThreeJsHoops();
        }

        function sendUISequence() {
            const seq1 = document.getElementById("seq-1").value;
            const seq2 = document.getElementById("seq-2").value;
            const seq3 = document.getElementById("seq-3").value;
            
            const sequenceGoals = [
                { id: shapes[seq1].id, shape: shapes[seq1].shape, x: shapes[seq1].x, y: shapes[seq1].y, z: shapes[seq1].z, yaw: shapes[seq1].yaw },
                { id: shapes[seq2].id, shape: shapes[seq2].shape, x: shapes[seq2].x, y: shapes[seq2].y, z: shapes[seq2].z, yaw: shapes[seq2].yaw },
                { id: shapes[seq3].id, shape: shapes[seq3].shape, x: shapes[seq3].x, y: shapes[seq3].y, z: shapes[seq3].z, yaw: shapes[seq3].yaw }
            ];

            if (ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: "ui", command: 3, goals: sequenceGoals, end_action: 0 }));
            }
        }

        // -------------------------------------------------------------------
        // Three.js 3D Visualizer Setup
        // -------------------------------------------------------------------
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a24);

        const camera = new THREE.PerspectiveCamera(60, (window.innerWidth - 380) / window.innerHeight, 0.1, 100);
        camera.position.set(-2, 3, 3);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth - 380, window.innerHeight);
        document.getElementById("canvas-container").appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.target.set(2, 1, 0);
        controls.update();

        const grid = new THREE.GridHelper(20, 20, 0x444466, 0x222233);
        scene.add(grid);

        // Drone True Model (Green body with cross arms)
        const drone = new THREE.Group();
        const bodyGeo = new THREE.CylinderGeometry(0.12, 0.12, 0.05, 16);
        const bodyMat = new THREE.MeshStandardMaterial({ color: 0x28a745, roughness: 0.3 });
        drone.add(new THREE.Mesh(bodyGeo, bodyMat));

        const armGeo = new THREE.BoxGeometry(0.35, 0.02, 0.02);
        const armMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
        const arm1 = new THREE.Mesh(armGeo, armMat); arm1.rotation.y = Math.PI / 4; drone.add(arm1);
        const arm2 = new THREE.Mesh(armGeo, armMat); arm2.rotation.y = -Math.PI / 4; drone.add(arm2);

        const droneCamera = new THREE.PerspectiveCamera(70, 320 / 240, 0.05, 20);
        droneCamera.rotation.y = -Math.PI / 2;
        drone.add(droneCamera);
        scene.add(drone);

        // Noisy Feedback Marker (Cyan wireframe sphere showing state estimation jitter)
        const feedbackGeo = new THREE.SphereGeometry(0.08, 12, 12);
        const feedbackMat = new THREE.MeshBasicMaterial({ color: 0x00e5ff, wireframe: true, transparent: true, opacity: 0.6 });
        const feedbackMarker = new THREE.Mesh(feedbackGeo, feedbackMat);
        scene.add(feedbackMarker);

        // Autopilot Setpoint Target Marker (Orange glowing sphere)
        const targetGeo = new THREE.SphereGeometry(0.06, 12, 12);
        const targetMat = new THREE.MeshBasicMaterial({ color: 0xff9900 });
        const targetMarker = new THREE.Mesh(targetGeo, targetMat);
        scene.add(targetMarker);

        // PiP Camera Renderer
        const pipRenderer = new THREE.WebGLRenderer({ antialias: true });
        pipRenderer.setSize(320, 240);
        document.getElementById("pip-three").appendChild(pipRenderer.domElement);

        const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
        dirLight.position.set(5, 10, 5);
        scene.add(dirLight);
        scene.add(new THREE.AmbientLight(0x606070));

        let hoopMeshes = [];

        function updateThreeJsHoops() {
            hoopMeshes.forEach(h => scene.remove(h));
            hoopMeshes = [];
            Object.values(shapes).forEach(s => {
                const geometry = new THREE.TorusGeometry(0.20, 0.03, 16, s.segments);
                const material = new THREE.MeshStandardMaterial({ color: s.color, roughness: 0.4 });
                const torus = new THREE.Mesh(geometry, material);
                torus.position.set(s.x, s.z, -s.y);
                if (s.segments === 4) torus.rotation.z = Math.PI / 4;
                torus.rotation.y = s.yaw + Math.PI / 2;
                torus.userData = { id: s.id, shape: s.shape };
                scene.add(torus);
                hoopMeshes.push(torus);
            });
        }
        
        updateVisionGoals();

        function updateVision() {
            pipRenderer.render(scene, droneCamera);
        }
        setInterval(updateVision, 100);

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = (window.innerWidth - 380) / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth - 380, window.innerHeight);
        });
    </script>
</body>
</html>
